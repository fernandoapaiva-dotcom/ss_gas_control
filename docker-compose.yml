version: '3.8'

services:
  app:
    build: .
    container_name: ss_gas_app
    restart: always
    env_file:
      - .env
    volumes:
      - ./frontend:/app/frontend
      - ./assets:/app/assets
      - ./test.db:/app/test.db  # BANCO DE DADOS AGORA É PERMANENTE!
    ports:
      - "8000:8000"
    networks:
      - gas-network

  evolution:
    image: atendai/evolution-api:v1.8.7
    container_name: evolution_api
    restart: always
    ports:
      - "8090:8080"
    environment:
      - SERVER_URL=http://localhost:8090
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=42a24fa6-403d-4c7b-b30a-9359e9a4f783
      - TZ=America/Sao_Paulo
      - NODE_OPTIONS=--max_old_space_size=256
    volumes:
      - ./evolution_instances:/evolution/instances
      - ./evolution_data:/evolution/store
    networks:
      - gas-network

  caddy:
    image: caddy:latest
    container_name: ss_gas_ssl
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gas-network

networks:
  gas-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
